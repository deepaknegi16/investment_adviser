# Production-shaped local stack: gateway -> workers -> shared cache.
#
#   docker compose up --build
#   https://localhost           (self-signed cert on first run — expect the warning)
#
# Everything still runs without this: `uvicorn app.main:app` alone is a complete
# working system with an in-process cache. This adds the tier that only starts
# to matter with more than one worker.

services:
  redis:
    image: redis:7-alpine
    # Cache only — every value is reconstructible from Yahoo, so persistence
    # would buy nothing and cost disk. maxmemory keeps it bounded; allkeys-lru
    # is right because entries all carry TTLs and are equally disposable.
    command: >
      redis-server --save "" --appendonly no
      --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  backend:
    build: ./backend
    env_file: ./backend/.env          # the same file the local run uses
    environment:
      REDIS_URL: redis://redis:6379/0
      TRUST_PROXY: "1"                # X-Forwarded-For is nginx's, not a client's
      LOG_LEVEL: INFO
      SERVICE_NAME: adviser-backend
      # Counters live in a shared dir because each --workers process is separate;
      # without this /metrics would report only whichever worker was scraped.
      PROMETHEUS_MULTIPROC_DIR: /tmp/prom
    volumes:
      # The database is state; the image is not. Bind-mounted so the container
      # and a local `uvicorn` run share one database rather than diverging.
      - ./backend/adviser.db:/app/adviser.db
      - ./backend/jwt_secret.key:/app/jwt_secret.key
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  frontend-build:
    build: ./frontend
    # Builds the SPA into a volume nginx serves, then exits. Not a long-running
    # service — `docker compose up` will show it as completed.
    volumes:
      - spa:/out
    command: sh -c "cp -r /dist/. /out/ && echo 'SPA built into the shared volume'"

  gateway:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/proxy_common.conf:/etc/nginx/proxy_common.conf:ro
      - ./deploy/certs:/etc/nginx/certs:ro
      - spa:/usr/share/nginx/html:ro
    depends_on:
      - backend
      - frontend-build
    healthcheck:
      # 127.0.0.1, not localhost: /etc/hosts maps localhost to ::1 as well,
      # busybox wget tries IPv6 first, and nginx binds IPv4 only — so the probe
      # got "connection refused" while the gateway was serving fine on 443.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 20s
      timeout: 4s
      retries: 3
    restart: unless-stopped

  # ---------------------------------------------------------------- ELK
  # Opt in with:  docker compose --profile observability up -d
  # Kept behind a profile because Elasticsearch and Kibana want ~2-3 GB while
  # the whole application stack runs in about 540 MB.

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    profiles: ["observability"]
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"      # local only; never expose this port
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"    # bounded, or it will take what it likes
      bootstrap.memory_lock: "true"
    ulimits:
      memlock: { soft: -1, hard: -1 }
    ports:
      - "127.0.0.1:9200:9200"              # loopback only
    volumes:
      - esdata:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health | grep -qE '\"status\":\"(green|yellow)\"'"]
      interval: 15s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  kibana:
    image: docker.elastic.co/kibana/kibana:8.15.3
    profiles: ["observability"]
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    ports:
      - "127.0.0.1:5601:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy
    restart: unless-stopped

  # Creates the Kibana data view. Without it Discover is empty even when the
  # index is full, which looks exactly like a broken pipeline.
  kibana-init:
    image: curlimages/curl:8.10.1
    profiles: ["observability"]
    volumes:
      - ./deploy/elk/kibana-init.sh:/init.sh:ro
    entrypoint: ["sh", "/init.sh"]
    depends_on:
      kibana:
        condition: service_started
    restart: on-failure

  filebeat:
    image: docker.elastic.co/beats/filebeat:8.15.3
    profiles: ["observability"]
    user: root
    command: ["filebeat", "-e", "--strict.perms=false"]
    volumes:
      - ./deploy/elk/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      # Read-only access to container stdout. The app writes JSON there and is
      # otherwise unaware this tier exists.
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - fbdata:/usr/share/filebeat/data
    depends_on:
      elasticsearch:
        condition: service_healthy
    restart: unless-stopped

volumes:
  spa:
  esdata:
  fbdata:
