# API gateway: TLS termination, edge rate limiting, static assets, and load
# balancing across the uvicorn workers.
#
# The app enforces its own rate limits too (app/ratelimit.py). That is not
# redundant: this layer protects the process from ever seeing a flood, while the
# app layer means the limits still hold if it is ever run without this proxy.

upstream adviser_api {
    least_conn;                 # requests differ wildly in cost — an AI refresh
                                # takes minutes, a watchlist poll milliseconds —
                                # so route by outstanding connections, not round
                                # robin, or a worker mid-analysis keeps getting
                                # handed new work.
    server backend:8000 max_fails=3 fail_timeout=20s;
    keepalive 32;
}

# Two zones because the traffic shapes differ: login is rare and worth
# defending hard, the API is polled every 60s by design.
limit_req_zone $binary_remote_addr zone=login:1m  rate=10r/m;
limit_req_zone $binary_remote_addr zone=api:10m   rate=10r/s;
limit_conn_zone $binary_remote_addr zone=conn:10m;

# nginx answers 503 by default, which says "the service is down" when the truth
# is "you sent too many". 429 is the correct code and is what a client needs in
# order to back off rather than retry immediately.
limit_req_status 429;
limit_conn_status 429;

server {
    listen 80;
    server_name _;

    # Health checks must not be forced through the TLS redirect. The container
    # probe runs busybox wget, which cannot follow a 301 into HTTPS, so every
    # check failed with "connection refused" while the gateway was serving
    # perfectly over 443 — a health signal that reported the opposite of reality.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/adviser.crt;
    ssl_certificate_key /etc/nginx/certs/adviser.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:4m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    limit_conn conn 24;

    # SPA: hashed assets are immutable, index.html must never be cached or a
    # deploy leaves clients pinned to a stale bundle.
    root /usr/share/nginx/html;
    index index.html;

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /api/auth/login {
        limit_req zone=login burst=5 nodelay;
        proxy_pass http://adviser_api;
        include /etc/nginx/proxy_common.conf;
    }

    location /api/ {
        limit_req zone=api burst=40 nodelay;
        proxy_pass http://adviser_api;
        include /etc/nginx/proxy_common.conf;

        # An AI refresh legitimately runs for minutes. The default 60s read
        # timeout would cut it off and surface as a 504 that looks like a bug.
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location = /api/health {
        access_log off;
        proxy_pass http://adviser_api;
        include /etc/nginx/proxy_common.conf;
    }
}
